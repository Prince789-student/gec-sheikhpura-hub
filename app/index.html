<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GEC Sheikhpura Student Life Hub mobile application with campus services, marketplace and community.">
  <meta name="google-signin-client_id" content="748172575005-400n0tange3otfpelk47uhvre79a70s2.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GEC SHK Student">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GEC SHK Student</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Unregister stale service worker on localhost so changes are instantly fresh
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
    }
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0b132b;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b132b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .loading-container {
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    .loading-logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      object-fit: cover;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255,255,255,0.15);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-container">
      <img src="assets/images/college_crest.jpg" class="loading-logo" alt="GEC Sheikhpura Logo" onerror="this.style.display='none'">
      <div class="spinner"></div>
      <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.5px;">GEC SHK Student</div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Loading student portal...</div>
    </div>
  </div>

  <script>
    (function() {
      var dismissed = false;
      function dismissLoading() {
        if (dismissed) return;
        var el = document.getElementById('loading');
        if (el) {
          dismissed = true;
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          setTimeout(function() {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 400);
        }
      }

      // 1. Primary: Flutter's first rendered frame event
      window.addEventListener('flutter-first-frame', dismissLoading);

      // 2. Secondary: DOM element presence check
      var interval = setInterval(function() {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          clearInterval(interval);
          setTimeout(dismissLoading, 200);
        }
      }, 150);

      // 3. Fallback: Maximum timeout so it never hangs
      setTimeout(dismissLoading, 4500);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
